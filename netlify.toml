[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/b/:id"
  to   = "/.netlify/functions/go?id=:id"
  status = 301
  force = true

[[redirects]]
  from = "/p/:id/pickup"
  to   = "/.netlify/functions/gophoto?id=:id&type=pickup"
  status = 301
  force = true

[[redirects]]
  from = "/p/:id/return"
  to   = "/.netlify/functions/gophoto?id=:id&type=return"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
