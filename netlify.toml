[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[functions."pickup-reminder"]
  schedule = "0 13 * * *"

[functions."abandoned-followup"]
  schedule = "0 */3 * * *"

[[redirects]]
  from = "/book"
  to   = "/index.html"
  status = 200

[[redirects]]
  from = "/howto"
  to   = "/howto.html"
  status = 200

[[redirects]]
  from = "/aboutus"
  to   = "/aboutus.html"
  status = 200

[[redirects]]
  from = "/b/:id"
  to   = "/.netlify/functions/go?id=:id"
  status = 301
  force = true

[[redirects]]
  from = "/p/:id/pickup"
  to   = "/.netlify/functions/gophoto?id=:id&type=pickup"
  status = 301
  force = true

[[redirects]]
  from = "/p/:id/return"
  to   = "/.netlify/functions/gophoto?id=:id&type=return"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
