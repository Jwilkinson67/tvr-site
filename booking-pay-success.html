<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Received — TVR</title>
  <link rel="icon" href="assets/tvr-logo-mark.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,sans-serif;background:#f6f7f9;color:#262626;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{background:#fff;max-width:520px;width:100%;padding:40px 36px;text-align:center;}
    .logo{font-size:22px;font-weight:700;color:#1568be;letter-spacing:-0.5px;margin-bottom:32px;}
    .icon{font-size:56px;margin-bottom:16px;}
    h1{font-size:24px;font-weight:700;margin-bottom:12px;}
    p{color:#3c3c3c;line-height:1.6;margin-bottom:8px;}
    .booking-id{font-family:monospace;background:#f4f6f9;padding:10px 16px;display:inline-block;margin:16px 0;font-size:16px;color:#1568be;font-weight:700;}
    .footer{margin-top:32px;font-size:12px;color:#9a9a9a;line-height:1.6;}
    .spinner{display:inline-block;width:36px;height:36px;border:4px solid #e6e6e6;border-top-color:#1568be;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Tennessee Valley Rentals LLC</div>
  <div id="content">
    <div class="spinner"></div>
    <p>Confirming your payment…</p>
  </div>
</div>
<script>
  (async function() {
    const params    = new URLSearchParams(location.search);
    const sessionId = params.get("session_id");
    const bookingId = params.get("booking_id"); // present for manual booking flow
    const token     = params.get("token");
    const el        = document.getElementById("content");

    if (!sessionId) {
      el.innerHTML = '<div class="icon">⚠️</div><h1>Invalid Link</h1><p>No session ID found. Please contact us.</p>';
      return;
    }

    try {
      let data;

      if (bookingId && token) {
        // Manual booking: update existing booking with payment info
        const res = await fetch("/.netlify/functions/charge-extra", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "confirm-manual-payment", sessionId, bookingId, token }),
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.error || "Confirmation failed.");
      } else {
        // Invoice flow: create new booking from Stripe session
        const res = await fetch("/.netlify/functions/send-invoice", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "confirm", sessionId }),
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.error || "Confirmation failed.");
      }

      const id = data.bookingId || bookingId || "";
      const isManual = !!(bookingId && token);

      el.innerHTML =
        '<div class="icon">✅</div>' +
        '<h1>Payment Authorized!</h1>' +
        (isManual
          ? '<p>All done — your documents, agreement, and payment have been submitted. Your card is authorized but <strong>will not be charged</strong> until your booking is approved.</p>'
          : '<p>Thank you — your payment has been processed and your booking is being reviewed.</p>') +
        (id ? '<div class="booking-id">' + id + '</div>' : '') +
        "<p>You'll receive a confirmation email once your booking is approved. Questions? Call or text <strong>(321) 765-3077</strong>.</p>" +
        '<div class="footer">Tennessee Valley Rentals LLC · Ooltewah, TN · info@rentwithtvr.com</div>';
    } catch (e) {
      el.innerHTML =
        '<div class="icon">⚠️</div>' +
        '<h1>Something went wrong</h1>' +
        '<p>Your payment went through but we couldn\'t confirm the booking automatically. Please contact us and we\'ll sort it out right away.</p>' +
        '<p style="margin-top:12px;"><strong>(321) 765-3077</strong></p>' +
        '<div class="footer">' + e.message + '</div>';
    }
  })();
</script>
</body>
</html>
